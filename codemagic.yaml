# Codemagic CI/CD — native iOS
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-native-ios-app/
#
# Перед первым билдом в Codemagic UI:
# 1) Add application → этот репозиторий → iOS
# 2) Team integrations → Developer Portal → добавить App Store Connect API key
#    (имя ключа должно совпадать с integrations.app_store_connect ниже)
# 3) Code signing identities → Distribution certificate + App Store provisioning profile
#    для bundle id com.FGU.WHBenchPress
# 4) Application variables → APP_STORE_APPLE_ID = Apple ID приложения из App Store Connect
#    (App Store Connect → App → App Information → Apple ID)
# 5) (опционально) CM_EMAIL_RECIPIENTS — email для уведомлений

workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Имя API-ключа из Codemagic → Team integrations → Developer Portal
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.FGU.WHBenchPress
      vars:
        BUNDLE_ID: com.FGU.WHBenchPress
        XCODE_PROJECT: "WhiteHood Bench 100.xcodeproj"
        XCODE_SCHEME: "WhiteHood Bench 100"
        # Задайте в Codemagic → Application settings → Environment variables
        APP_STORE_APPLE_ID: $APP_STORE_APPLE_ID
      xcode: latest
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          #!/bin/sh
          set -e
          cd "$CM_BUILD_DIR"
          LATEST_BUILD_NUMBER=0
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" \
              || app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" \
              || echo 0)
          fi
          echo "Using build number: $(($LATEST_BUILD_NUMBER + 1))"
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - $CM_EMAIL_RECIPIENTS
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # Локальная/CI проверка архива без публикации (нужны всё те же signing identities)
  ios-unsigned-check:
    name: iOS Build Check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.FGU.WHBenchPress
      vars:
        XCODE_PROJECT: "WhiteHood Bench 100.xcodeproj"
        XCODE_SCHEME: "WhiteHood Bench 100"
      xcode: latest
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
